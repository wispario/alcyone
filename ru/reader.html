<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="apple-touch-icon" href="../icon.png">
    <title>Чтение комикса — Алкиона</title>
    <script>
        if (localStorage.getItem('comic_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
        if (window.innerWidth > 768) {
            const savedMode = localStorage.getItem('comic_view_mode') || 'full';
            document.documentElement.classList.add('mode-' + savedMode);
        } else {
            document.documentElement.classList.add('mode-full');
        }
    </script>
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Yandex.Metrika counter -->

<body>
    <header class="site-header">
        <div class="header-left">
            <a href="index.html" class="site-title">Алкиона</a>
            <button id="chapters-btn" class="icon-btn">Главы</button>
        </div>
        <div class="header-controls">
            <button id="mode-toggle" class="icon-btn">↔️ Ширина</button>
            <button id="theme-toggle" class="icon-btn">☀️ Светлая</button>
        </div>
    </header>

    <div class="reader-container">
        <div id="comic-view" class="comic-view">
            <img id="comic-page-img" class="comic-image" src="" alt="Страница комикса">
        </div>

        <div class="reader-nav-panel">
            <button id="back-btn" class="nav-btn">← Главы</button>
            <button id="progress-btn" class="progress-btn">1 / 15</button>
            <button id="next-chapter-btn" class="nav-btn">Следующая →</button>
        </div>
    </div>

    <!-- Боковая панель со списком глав -->
    <div id="chapters-overlay" class="chapters-overlay"></div>
    <nav id="chapters-drawer" class="chapters-drawer">
        <div class="chapters-drawer-header">
            <h3 id="chapters-drawer-title">Главы</h3>
            <button id="chapters-close" class="close-modal">&times;</button>
        </div>
        <div id="chapters-list" class="chapters-drawer-list"></div>
    </nav>

    <!-- Модальное окно быстрого перехода по страницам -->
    <div id="pages-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Выбрать страницу</h3>
                <button id="close-modal" class="close-modal">&times;</button>
            </div>
            <div id="pages-grid" class="pages-grid"></div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/reader.js"></script>
