<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Reader</title>
    <!-- Мгновенное применение темы до рендеринга страницы -->
    <script>
        if (localStorage.getItem('comic_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
    <link rel="stylesheet" href="../assets/css/style.css"> <!-- или ./assets/css/style.css для корня -->
</head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чтение комикса</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="site-title">Алкиона</a>
        <div class="header-controls">
            <button id="mode-toggle" class="icon-btn">↔️ Ширина</button>
            <button id="lang-switch" class="icon-btn">EN</button>
            <button id="theme-toggle" class="icon-btn">🌙 Темная</button>
        </div>
    </header>

    <div class="reader-container">
        <div id="comic-view" class="comic-view">
            <img id="comic-page-img" class="comic-image" src="" alt="Страница комикса">
        </div>

        <div class="reader-nav-panel">
            <button id="back-btn" class="nav-btn">← Главы</button>
            <button id="progress-btn" class="progress-btn">1 / 15</button>
            <button id="next-chapter-btn" class="nav-btn">Следующая →</button>
        </div>
    </div>

    <div id="pages-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Выбрать страницу</h3>
                <button id="close-modal" class="close-modal">&times;</button>
            </div>
            <div id="pages-grid" class="pages-grid"></div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/reader.js"></script>
</body>
</html>
