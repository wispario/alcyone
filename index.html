<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Reader</title>
    <!-- Мгновенное применение темы до рендеринга страницы -->
    <script>
        if (localStorage.getItem('comic_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
    <link rel="stylesheet" href="../assets/css/style.css"> <!-- или ./assets/css/style.css для корня -->
</head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Reader - Language Selection</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="gateway-body">
    <div class="gateway-container">
        <h1>Выберите язык / Choose Language</h1>
        <div class="gateway-buttons">
            <button class="lang-btn" data-lang="ru">Русский</button>
            <button class="lang-btn" data-lang="en">English</button>
        </div>
    </div>
    <script src="./assets/js/main.js"></script>
</body>
</html>
