<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcyone</title>
    <link rel="icon" type="image/png" sizes="512x512" href="../icon.png">
    <link rel="apple-touch-icon" href="../icon.png">
    <script>
        if (localStorage.getItem('comic_theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
        if (window.innerWidth > 768) {
            const savedMode = localStorage.getItem('comic_view_mode') || 'full';
            document.documentElement.classList.add('mode-' + savedMode);
        } else {
            document.documentElement.classList.add('mode-full');
        }
    </script>
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Yandex.Metrika counter -->
    <script type="text/javascript">
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=113884728', 'ym');

<body>
    <header class="site-header">
        <a href="index.html" class="site-title">Alcyone</a>
        <div class="header-controls">
            <button id="lang-switch" class="icon-btn">EN</button>
            <button id="theme-toggle" class="icon-btn">☀️ Light</button>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Chapters</h2>
        <div id="chapters-grid" class="chapters-grid"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const res = await fetch('config.json');
            const data = await res.json();
            const grid = document.getElementById('chapters-grid');
            
            data.chapters.forEach(ch => {
                const card = document.createElement('a');
                card.href = `reader.html?ch=${ch.id}&p=1`;
                card.className = 'chapter-card';
                card.innerHTML = `
                    <div class="chapter-cover-wrapper">
                        <img src="${ch.cover}" alt="${ch.title}" class="chapter-cover" loading="lazy">
                        <div class="chapter-info">
                            <h3>${ch.title}</h3>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        });
    </script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
